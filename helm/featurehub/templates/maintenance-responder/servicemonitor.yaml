{{- if and (include "featurehub.maintenance.responderEnabled" .) .Values.maintenance.responder.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "featurehub.maintenanceResponder.name" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    {{- include "featurehub.maintenanceResponder.labels" . | nindent 4 }}
    {{- with .Values.maintenance.responder.prometheus.labels }}
      {{- toYaml .  | nindent 4}}
    {{- end }}
spec:
  endpoints:
    - honorLabels: true
      port: metrics
      path: /metrics
  selector:
    matchLabels:
      {{- include "featurehub.maintenanceResponder.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
