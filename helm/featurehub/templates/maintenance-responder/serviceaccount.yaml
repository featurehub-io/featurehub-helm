{{- if and (include "featurehub.maintenance.responderEnabled" .) .Values.maintenance.responder.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "featurehub.maintenanceResponder.serviceAccountName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- with .Values.maintenance.responder.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "featurehub.maintenanceResponder.labels" . | nindent 4 }}
  {{- with .Values.maintenance.responder.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
